# Exclude vendored pstack from whitespace fixers so upstream stays byte-identical.
exclude: ^\.cursor/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: go-checks
        name: go-checks (gofmt, vet, golangci-lint, test)
        entry: scripts/go-checks.sh
        language: system
        pass_filenames: false
        files: ^worker/.*(\.go|go\.mod|go\.sum|\.golangci\.yml)$

      - id: fallow-audit
        name: fallow-audit
        entry: scripts/fallow-audit-hook.sh
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|mjs)$
