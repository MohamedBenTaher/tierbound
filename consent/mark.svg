<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tierbound">
  <title>tierbound</title>
  <!-- Two posts and three even tiers. The gold tier is the one action a human let through. -->
  <rect width="64" height="64" rx="14" fill="#0F766E"/>
  <g fill="#fff">
    <rect x="16" y="14" width="4" height="36" rx="2"/>
    <rect x="44" y="14" width="4" height="36" rx="2"/>
    <rect x="24" y="30" width="16" height="4" rx="2"/>
    <rect x="24" y="40" width="16" height="4" rx="2"/>
  </g>
  <rect x="24" y="20" width="16" height="4" rx="2" fill="#FDE68A"/>
</svg>
