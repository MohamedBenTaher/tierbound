<!-- tierbound OAuth consent stub (plan step 2.1). Throwaway, not a product UI.
     Hosted: https://mohamedbentaher.github.io/tierbound/oauth/consent (GitHub Pages),
     or python3 -m http.server 3000 --directory consent opened as localhost.
     Local stack: the same server opened as http://127.0.0.1:3000.
     Auth redirects here with ?authorization_id=... -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tierbound consent</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 1.5rem; }
  code { background: #f2f2f2; padding: 0 .25rem; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>Authorize</h1>
  <p id="status">Loading…</p>
  <div id="details" hidden>
    <p><strong id="client"></strong> requests scopes: <code id="scopes"></code></p>
    <button id="approve">Approve</button>
    <button id="deny">Deny</button>
  </div>
  <div id="signin" hidden>
    <p id="github-row" hidden><button id="do-github">Sign in with GitHub</button><br><br>or with email (fallback):</p>
    <p id="email-hint">Sign in to continue (local: any dev account):</p>
    <input id="email" type="email" placeholder="email"><br><br>
    <input id="password" type="password" placeholder="password"><br><br>
    <button id="do-signin">Sign in</button>
  </div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
// Publishable (public) keys only. Hosted Auth redirects to site_url in
// [remotes.hosted] (localhost:3000 or the Pages URL); the local stack uses
// http://127.0.0.1:3000. Same page, backend picked by hostname.
const HOSTED = {
  url: "https://gdpzeenwivmluhkwjsuu.supabase.co",
  key: "sb_publishable_rVoNZimCyKZZN_FygspDHw_qTSfFbQ3",
  allowSignUp: false,
  github: true, // allowlisted approvers only (before-user-created hook)
};
const BACKENDS = {
  localhost: HOSTED,
  "mohamedbentaher.github.io": HOSTED,
  "127.0.0.1": {
    url: "http://127.0.0.1:54321",
    key: "eyJhbGciOiJFUzI1NiIsImtpZCI6ImVjMDkzYWFlLTQ3MjItNDdmZS1hYWJjLTUzYmJkNjYxMGE2NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjIxMDk0Mzk0OTN9.FhyLhPBgVPnfgmgyA3yPLX2OBoXnRHOhQ_uInW_l9smq3i4EKhdtewTz687KMzzVpDQ0m9JAcxUyTpJ3sglZNw",
    allowSignUp: true,
  },
};
const backend = BACKENDS[location.hostname] ?? BACKENDS["127.0.0.1"];
const supabase = createClient(backend.url, backend.key);

const authorizationId = new URLSearchParams(location.search).get("authorization_id");
const $ = (id) => document.getElementById(id);

async function init() {
  if (!authorizationId) {
    $("status").textContent = "No authorization_id in the URL.";
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    // A refused GitHub sign-in (e.g. not on the approver allowlist) comes back
    // as #error_description=... on this URL.
    const oauthError = new URLSearchParams(location.hash.slice(1)).get("error_description")
      ?? new URLSearchParams(location.search).get("error_description");
    $("status").textContent = oauthError ? "Sign-in refused: " + oauthError : "Sign in required.";
    $("signin").hidden = false;
    $("github-row").hidden = !backend.github;
    $("email-hint").hidden = !!backend.github;
    return;
  }
  const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error) {
    $("status").textContent = "Could not load authorization: " + error.message;
    return;
  }
  $("status").textContent = "A client wants to act on your behalf.";
  $("client").textContent = data.client_name ?? data.client_id;
  $("scopes").textContent = data.scope ?? "(none)";
  $("details").hidden = false;
}

async function decide(fn) {
  const { data, error } = await fn(authorizationId);
  if (error) {
    $("status").textContent = "Failed: " + error.message;
    return;
  }
  location.assign(data.redirect_url);
}

$("do-signin").addEventListener("click", async () => {
  const email = $("email").value, password = $("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    // Local stack only: first sign-in creates the dev account. Hosted has
    // sign-up disabled, and a sign-up attempt would mask the real error.
    if (backend.allowSignUp && error.code === "invalid_credentials") {
      const { error: signUpError } = await supabase.auth.signUp({ email, password });
      if (!signUpError) { location.reload(); return; }
      $("status").textContent = "Sign-up failed: " + signUpError.message;
      return;
    }
    $("status").textContent = "Sign-in failed: " + error.message + (error.code ? " (" + error.code + ")" : "");
    return;
  }
  location.reload();
});
$("do-github").addEventListener("click", async () => {
  // Comes back to this exact URL (keeps ?authorization_id); supabase-js picks
  // the session up from the redirect. Must match additional_redirect_urls.
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "github",
    options: { redirectTo: location.href },
  });
  if (error) $("status").textContent = "GitHub sign-in failed: " + error.message;
});
$("approve").addEventListener("click", () => decide((id) => supabase.auth.oauth.approveAuthorization(id)));
$("deny").addEventListener("click", () => decide((id) => supabase.auth.oauth.denyAuthorization(id)));

init();
</script>
</body>
</html>
