# Publish consent/ (the OAuth consent page) to GitHub Pages, so approving an
# MCP client needs no local server (plan "Setup smoothing", B1).
# Dormant until Pages is available for this repo (public repo or paid plan)
# and the repo variable CONSENT_PAGES is "true"; until then the job is skipped.
name: consent-pages
on:
  push:
    branches: [main]
    paths: ["consent/**", ".github/workflows/consent-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: consent-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.CONSENT_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: consent
      - id: deploy
        uses: actions/deploy-pages@v4
