name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow-audit diffs against the base branch; PR checkouts are shallow.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Python is only here to run pre-commit itself.
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  # Plan step 3.2: replays evals/results/<config_hash>.json for the agent
  # config in this commit; red if the recording is missing or scores below
  # evals/rubric.json. No secrets needed. If the repo has a GROQ_API_KEY
  # Actions secret and the EVAL_LIVE variable is "1", it also drafts live.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - name: Eval gate
        env:
          EVAL_LIVE: ${{ vars.EVAL_LIVE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./evals/gate.sh
